# Guardrails (NeMo) with a Kubernetes service account token
#
# Sends the pod's login token on Praxis's calls to NeMo, so kube-rbac-proxy
# can decide whether Praxis is allowed to call. The other NeMo examples,
# nemo-guardrails.yaml and nemo-guardrails-response.yaml, call NeMo with
# no login token.
#
# The TrustyAI Service Operator runs kube-rbac-proxy in front of NeMo. The
# proxy checks the token, then forwards the request.
#
# In production, use https:// for both addresses below. The token is sent
# when the host and port of the NeMo call match this filter's endpoint.
# http and https are treated as the same for that match. Praxis dials the
# provider address, so an http:// provider address sends the token where
# anyone on the network can read it, even when this filter's endpoint is
# https:// on the same host and port.
#
# The NeMo provider has no place to set a certificate authority. An https
# call checks the proxy certificate against the trust store loaded for the
# Praxis process: the bundle in SSL_CERT_FILE or SSL_CERT_DIR when one of
# those is set, otherwise the system certificate bundle. Put the certificate
# that signed the proxy certificate into that store before Praxis starts.
# On OpenShift that signer is the service CA. This example uses
# http://127.0.0.1 because it calls a local stand-in.
#
# Add this to your Pod spec to mount the token:
#
#   volumes:
#     - name: nemo-token
#       projected:
#         sources:
#           - serviceAccountToken:
#               path: token
#               expirationSeconds: 3600   # Kubernetes rotates before expiry
#   containers:
#     - volumeMounts:
#         - name: nemo-token
#           mountPath: /var/run/secrets/tokens/nemo
#           readOnly: true

listeners:
  - name: gateway
    address: "0.0.0.0:8080"
    filter_chains:
      - nemo-guardrails

filter_chains:
  - name: nemo-guardrails
    filters:
      - filter: ai_guardrails
        outbound_chain: nemo-outbound
        provider:
          type: nemo
          # Requires NeMo Guardrails 0.24.0 or newer.
          # Local stand-in. In production this is the kube-rbac-proxy https:// address.
          endpoint: "http://127.0.0.1:3001/v1/checks"
          guardrails:
            config_ids: ["your-config"] # replace with a configuration deployed in NeMo
          timeout_ms: 5000
          max_message_checks: 32
        phase:
          request: true
          response: false

      - filter: router
        routes:
          - path_prefix: "/"
            cluster: provider

      - filter: load_balancer
        clusters:
          - name: provider
            endpoints:
              - "127.0.0.1:3000"

  # Sends the pod's login token on calls to NeMo so the auth proxy can
  # check who is calling.
  - name: nemo-outbound
    filters:
      - filter: service_account_token
        token_file: /var/run/secrets/tokens/nemo/token
        # Required. Use the same host and port as the provider address above.
        # http and https are treated as the same for the match. Praxis dials
        # the provider address, so production sets both to https://. Praxis
        # will not start if endpoint is missing. The token goes only to this
        # host and port.
        endpoint: "http://127.0.0.1:3001/v1/checks"
      - filter: request_id

insecure_options:
  allow_private_endpoints: true # example proxies to local backends
  allow_private_upstreams: true # example calls the local NeMo service
