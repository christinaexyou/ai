# Guardrails (NeMo) with a Kubernetes service account token
#
# Sends the pod's login token on Praxis's calls to NeMo, so kube-rbac-proxy
# can decide whether Praxis is allowed to call. The other NeMo examples,
# nemo-guardrails.yaml and nemo-guardrails-response.yaml, call NeMo with
# no login token.
#
# The TrustyAI Service operator puts kube-rbac-proxy in front of NeMo. The proxy
# checks the login token, then passes the request on. The provider address
# below is the address Praxis calls. In production that address is the proxy.
#
# In production, set both addresses below to https:// and use the same host
# and port in each. If you only replace 127.0.0.1 and leave http://, the
# login token travels on the network where other pods can read it. Putting
# https:// on the token address does not fix that. Praxis calls the provider
# address.
#
# NeMo's settings have no place to name who signed the proxy's certificate.
# An https call trusts that certificate only when the Praxis process already
# trusts the signer. The list of trusted signers is the file in SSL_CERT_FILE,
# or the directory in SSL_CERT_DIR, when one of those is set. Otherwise it is
# the computer's usual list. Before Praxis starts, add the proxy's signer to
# that list. On OpenShift the signer is the service CA. Mount that bundle
# into the pod and set SSL_CERT_FILE or SSL_CERT_DIR to the mounted file.
# This example stays on http://127.0.0.1 because it talks to a local stand-in.
#
# Add this to your Pod spec to mount the token:
#
#   volumes:
#     - name: nemo-token
#       projected:
#         sources:
#           - serviceAccountToken:
#               path: token
#               expirationSeconds: 3600   # Kubernetes rotates before expiry
#   containers:
#     - volumeMounts:
#         - name: nemo-token
#           mountPath: /var/run/secrets/tokens/nemo
#           readOnly: true

listeners:
  - name: gateway
    address: "0.0.0.0:8080"
    filter_chains:
      - nemo-guardrails

filter_chains:
  - name: nemo-guardrails
    filters:
      - filter: ai_guardrails
        outbound_chain: nemo-outbound
        provider:
          type: nemo
          # Requires NeMo Guardrails 0.24.0 or newer.
          # Local stand-in. In production use https:// and the proxy's host.
          # This is the address Praxis calls. Leaving http:// after you change
          # the host lets other pods read the login token. See the comment at
          # the top for how Praxis trusts the proxy's certificate.
          endpoint: "http://127.0.0.1:3001/v1/checks"
          guardrails:
            config_ids: ["your-config"] # replace with a configuration deployed in NeMo
          timeout_ms: 5000
          max_message_checks: 32
        phase:
          request: true
          response: false

      - filter: router
        routes:
          - path_prefix: "/"
            cluster: provider

      - filter: load_balancer
        clusters:
          - name: provider
            endpoints:
              - "127.0.0.1:3000"

  # Sends the pod's login token on calls to NeMo so the auth proxy can
  # check who is calling.
  - name: nemo-outbound
    filters:
      - filter: service_account_token
        token_file: /var/run/secrets/tokens/nemo/token
        # Required. Use the same host and port as the provider address above.
        # In production use https:// here too. https:// on this line does not
        # hide the token when the provider address is still http://. Praxis
        # will not start if this line is missing. The token is sent only to
        # this host and port.
        endpoint: "http://127.0.0.1:3001/v1/checks"
      - filter: request_id

insecure_options:
  allow_private_endpoints: true # example proxies to local backends
  allow_private_upstreams: true # example calls the local NeMo service
